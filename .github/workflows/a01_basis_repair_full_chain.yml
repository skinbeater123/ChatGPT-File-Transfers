name: A01 basis repair full chain
on:
  push:
    paths:
      - '.github/workflows/a01_basis_repair_full_chain.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Recover validated native v01 donor from accepted v02 proof
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf /tmp/base; mkdir -p /tmp/base
          gh run download 33459151354 --repo "$GITHUB_REPOSITORY" -n dtc-sprint-a-v02-proof -D /tmp/base
          cp /tmp/base/DTC_BIGANT_A01_DONOR_v01.blend .
          test "$(sha256sum DTC_BIGANT_A01_DONOR_v01.blend|awk '{print $1}')" = 4cc2d99d1e8e760aad978e8032257682c498cfaced4787248669640a3d981c37
      - name: Blender 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          echo BLENDER=/tmp/blender-5.2.1-linux-x64/blender >> "$GITHUB_ENV"
          python -m py_compile .github/scripts/rebuild_a01_v01_to_v02_basis_fixed.py .github/scripts/modify_a01_v02_to_dtc_v03_hardpoints.py .github/scripts/modify_a01_v03_to_dtc_v04_cockpit_packaging.py
      - name: Build basis-correct v02
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --python .github/scripts/rebuild_a01_v01_to_v02_basis_fixed.py -- --in "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend" --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02_basis_fixed_report.json" --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.glb"
          sha256sum DTC_SPRINT_A_v02.blend|tee DTC_SPRINT_A_v02.blend.sha256
          sha256sum DTC_SPRINT_A_v02.glb|tee DTC_SPRINT_A_v02.glb.sha256
      - name: Validate v02 basis and axis-specific edit boundary
        shell: bash
        run: |
          cat >/tmp/v02check.py <<'PY'
          import bpy, math
          T=3e-5; w=bpy.data.collections['DTC_SPRINT_A_WORK']; b=bpy.data.collections['DTC_SPRINT_A_BASELINE_V01']; s=bpy.data.collections['SOURCE_BIGANT_A01_LOCKED']
          mm=lambda c:[o for o in c.objects if o.type=='MESH']; assert [len(mm(x)) for x in(s,w,b)]==[92,16,16];assert s.get('dtc.locked_source') is True and b.get('dtc.locked_backup') is True;assert bpy.context.scene.get('dtc.asset_version')=='DTC_SPRINT_A_v02';assert bpy.context.scene.get('dtc.authoring_basis')=='DTC_X_FORWARD_Y_LEFT_Z_UP_METRES_NORMALIZED';assert not({id(o.data) for o in mm(w)}&{id(o.data) for o in mm(b)})
          def hits(c,p):return[o for o in mm(c) if o.name.startswith(p)]
          def bd(a):
              p=[o.matrix_world@v.co for o in a for v in o.data.vertices];return [min(x[i] for x in p) for i in range(3)],[max(x[i] for x in p) for i in range(3)]
          top=bd(hits(w,'TopWing_LOD0_DMG0'));front=bd(hits(w,'FrontWing_LOD0_DMG0'));top0=bd(hits(b,'TopWing_LOD0_DMG0'));front0=bd(hits(b,'FrontWing_LOD0_DMG0'))
          ext=lambda q:[q[1][i]-q[0][i] for i in range(3)]
          te,fe,te0,fe0=map(ext,(top,front,top0,front0))
          assert abs(te[0]-78.2231*.0254)<T and abs(te[1]-62.3471*.0254)<T and abs(te[2]-te0[2])<T,(te,te0)
          assert abs(fe[0]-21.9439*.0254)<T and abs(fe[1]-40.2439*.0254)<T and abs(fe[2]-fe0[2])<T,(fe,fe0)
          # nerfs may move only X/Y; their Z envelopes must exactly match normalized v01 backup
          for pfx in ('BumperLeft_DMG0_LOD0','BumperRight_DMG0_LOD0'):
              a0=bd(hits(b,pfx));a1=bd(hits(w,pfx));assert abs(a0[0][2]-a1[0][2])<T and abs(a0[1][2]-a1[1][2])<T,(pfx,a0,a1)
          # DTC authoring basis: lateral is Y, vertical is Z
          lf=hits(w,'WheelLF_LOD0')[0];rf=hits(w,'WheelRF_LOD0')[0]
          assert lf.matrix_world.translation.y>0 and rf.matrix_world.translation.y<0 and lf.matrix_world.translation.z<0 and rf.matrix_world.translation.z<0
          ch=sorted(o.name for o in mm(w) if o.get('dtc.v02_modified') is True);assert len(ch)==5,ch
          print('V02_BASIS_AXIS_PASS',{'top_ext':te,'front_ext':fe,'lf_origin':list(lf.matrix_world.translation),'rf_origin':list(rf.matrix_world.translation),'changed':ch})
          PY
          "$BLENDER" --background DTC_SPRINT_A_v02.blend --python /tmp/v02check.py
      - name: Build corrected v03 from corrected v02
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --python .github/scripts/modify_a01_v02_to_dtc_v03_hardpoints.py -- --in "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.blend" --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT_report.json" --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.glb"
          sha256sum DTC_SPRINT_A_v03_HARDPOINT.blend|tee DTC_SPRINT_A_v03_HARDPOINT.blend.sha256
          sha256sum DTC_SPRINT_A_v03_HARDPOINT.glb|tee DTC_SPRINT_A_v03_HARDPOINT.glb.sha256
      - name: Validate v03 hard-points on X Y and preserved Z
        shell: bash
        run: |
          cat >/tmp/v03check.py <<'PY'
          import bpy
          I=.0254;T=2e-6;w=bpy.data.collections['DTC_SPRINT_A_WORK'];b2=bpy.data.collections['DTC_SPRINT_A_BASELINE_V02'];mm=lambda c:[o for o in c.objects if o.type=='MESH'];assert len(mm(w))==16 and len(mm(b2))==16 and b2.get('dtc.locked_backup') is True;assert bpy.context.scene.get('dtc.asset_version')=='DTC_SPRINT_A_v03_HARDPOINT';assert not({id(o.data) for o in mm(w)}&{id(o.data) for o in mm(b2)})
          def one(c,p):a=[o for o in mm(c) if o.name.startswith(p)];assert len(a)==1;return a[0]
          lf,rf,lr,rr=[one(w,p) for p in('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0')];lf0,rf0,lr0,rr0=[one(b2,p) for p in('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0')]
          wb=(lf.matrix_world.translation.x+rf.matrix_world.translation.x-lr.matrix_world.translation.x-rr.matrix_world.translation.x)/2;ft=lf.matrix_world.translation.y-rf.matrix_world.translation.y;rt=lr.matrix_world.translation.y-rr.matrix_world.translation.y
          assert abs(wb-85.4193*I)<T and abs(ft-55.4295*I)<T and abs(rt-52.7976*I)<T,(wb,ft,rt)
          # hard-point operation must not invent vertical ride-height change
          assert abs(lf.matrix_world.translation.z-(lf0.matrix_world.translation.z+rf0.matrix_world.translation.z)/2)<T
          assert abs(rf.matrix_world.translation.z-(lf0.matrix_world.translation.z+rf0.matrix_world.translation.z)/2)<T
          assert abs(lr.matrix_world.translation.z-(lr0.matrix_world.translation.z+rr0.matrix_world.translation.z)/2)<T
          assert abs(rr.matrix_world.translation.z-(lr0.matrix_world.translation.z+rr0.matrix_world.translation.z)/2)<T
          for o in(lf,rf,lr,rr):assert o.get('dtc.v03_pivot_relocated') is True and float(o.get('dtc.v03_pivot_error_m'))<T
          ch=sorted(o.name for o in mm(w) if o.get('dtc.v03_modified') is True);assert len(ch)==7,ch
          print('V03_XY_HARDPOINT_Z_PASS',wb,ft,rt,[list(o.matrix_world.translation) for o in(lf,rf,lr,rr)],ch)
          PY
          "$BLENDER" --background DTC_SPRINT_A_v03_HARDPOINT.blend --python /tmp/v03check.py
      - name: Build corrected v04 from corrected v03
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --python .github/scripts/modify_a01_v03_to_dtc_v04_cockpit_packaging.py -- --in "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.blend" --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend" --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING_report.json" --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb"
          sha256sum DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend|tee DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend.sha256
          sha256sum DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb|tee DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb.sha256
      - name: Validate v04 vertical packaging and retained XY hard-points
        shell: bash
        run: |
          cat >/tmp/v04check.py <<'PY'
          import bpy
          I=.0254;T=2e-6;w=bpy.data.collections['DTC_SPRINT_A_WORK'];b3=bpy.data.collections['DTC_SPRINT_A_BASELINE_V03'];mm=lambda c:[o for o in c.objects if o.type=='MESH'];assert len(mm(w))==16 and len(mm(b3))==16 and b3.get('dtc.locked_backup') is True;assert bpy.context.scene.get('dtc.asset_version')=='DTC_SPRINT_A_v04_COCKPIT_PACKAGING';assert not({id(o.data) for o in mm(w)}&{id(o.data) for o in mm(b3)})
          def one(c,p):a=[o for o in mm(c) if o.name.startswith(p)];assert len(a)==1;return a[0]
          lf,rf,lr,rr=[one(w,p) for p in('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0')];wb=(lf.matrix_world.translation.x+rf.matrix_world.translation.x-lr.matrix_world.translation.x-rr.matrix_world.translation.x)/2;ft=lf.matrix_world.translation.y-rf.matrix_world.translation.y;rt=lr.matrix_world.translation.y-rr.matrix_world.translation.y;assert abs(wb-85.4193*I)<T and abs(ft-55.4295*I)<T and abs(rt-52.7976*I)<T
          def zmax(o):return max((o.matrix_world@v.co).z for v in o.data.vertices)
          d=one(w,'Driver_LOD0');d0=one(b3,'Driver_LOD0');assert abs((zmax(d0)-zmax(d))-.18)<T,(zmax(d0),zmax(d));assert abs(zmax(d)-.54916874)<3e-5,(zmax(d),)
          ch=sorted(o.name for o in mm(w) if o.get('dtc.v04_modified') is True);assert len(ch)==3,ch
          print('V04_VERTICAL_AND_PIVOTS_PASS',{'driver_before_zmax':zmax(d0),'driver_after_zmax':zmax(d),'wheelbase':wb,'front_track':ft,'rear_track':rt,'changed':ch})
          PY
          "$BLENDER" --background DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend --python /tmp/v04check.py
      - uses: actions/upload-artifact@v4
        with:
          name: dtc-sprint-a-basis-repair-full-chain
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            DTC_SPRINT_A_v02.blend
            DTC_SPRINT_A_v02.blend.sha256
            DTC_SPRINT_A_v02.glb
            DTC_SPRINT_A_v02.glb.sha256
            DTC_SPRINT_A_v02_basis_fixed_report.json
            DTC_SPRINT_A_v03_HARDPOINT.blend
            DTC_SPRINT_A_v03_HARDPOINT.blend.sha256
            DTC_SPRINT_A_v03_HARDPOINT.glb
            DTC_SPRINT_A_v03_HARDPOINT.glb.sha256
            DTC_SPRINT_A_v03_HARDPOINT_report.json
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend.sha256
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb.sha256
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING_report.json
