name: A01 donor Blender staging proof

on:
  push:
    paths:
      - '.github/workflows/a01_blender_stage.yml'

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer source
        uses: actions/checkout@v4

      - name: Extract exact retail A01 donor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh pillow
          rm -rf /tmp/a01 /tmp/a01_out
          mkdir -p /tmp/a01 /tmp/a01_out
          unzip -q 'a01_sprintcar.zip' -d /tmp/a01
          PSSG="$(find /tmp/a01 -type f -iname 'a01_sprintcar_shaded' | head -n 1)"
          test -n "$PSSG"
          python .github/scripts/extract_a01_real.py "$PSSG" --out-dir /tmp/a01_out

      - name: Verify extracted donor census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a01_out/A01_real_donor_extraction_report.json'))
          s=d['source']; c=d['donor_lod0_intact_dtc']; allg=d['source_all_render_geometry_dtc']
          assert s['pssg_sha256']=='6621074f3048a4ee41606c6fd15b501bc3fd8723a423ee9a0b7368fb4f428bd6'
          assert s['parsed_nodes']==5628 and s['rendernodes']==80
          assert allg['render_instances']==92
          assert c['render_instances']==16 and c['streamed_vertices']==30660 and c['triangles']==14892
          print('A01_REAL_DONOR_CENSUS_PASS')
          PY

      - name: Download Blender 5.2.1 Linux x64
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          BLENDER=/tmp/blender-5.2.1-linux-x64/blender
          test -x "$BLENDER"
          "$BLENDER" --version
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Build native Blender donor scene
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage_a01.py <<'PY'
          import bpy, json
          from pathlib import Path
          SOURCE='SOURCE_BIGANT_A01_LOCKED'; WORK='DTC_SPRINT_A_WORK'; LOC='DTC_SPRINT_A_LOCATORS'
          SHA='6621074f3048a4ee41606c6fd15b501bc3fd8723a423ee9a0b7368fb4f428bd6'
          source_glb=Path('/tmp/a01_out/A01_source_all_render_geometry_dtc.glb')
          work_glb=Path('/tmp/a01_out/A01_donor_lod0_intact_dtc.glb')
          loc_json=Path('/tmp/a01_out/A01_top_level_locators.json')
          out=Path.cwd()/'DTC_BIGANT_A01_DONOR_v01.blend'
          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene=bpy.context.scene; scene.unit_settings.system='METRIC'; scene.unit_settings.length_unit='METERS'; scene.unit_settings.scale_length=1.0
          def coll(name):
              c=bpy.data.collections.new(name); scene.collection.children.link(c); return c
          def move(obj,c):
              for old in list(obj.users_collection): old.objects.unlink(obj)
              c.objects.link(obj)
          def import_glb(path,c,role,expected):
              before=set(bpy.data.objects); bpy.ops.import_scene.gltf(filepath=str(path)); objs=[o for o in bpy.data.objects if o not in before]; meshes=[o for o in objs if o.type=='MESH']
              assert len(meshes)==expected,(role,len(meshes),expected)
              for o in objs:
                  move(o,c); o['dtc.evidence_domain']='COMPARATIVE TITLE DIRECT'; o['dtc.source_pssg_sha256']=SHA; o['dtc.source_role']=role
              return objs,meshes
          source=coll(SOURCE); work=coll(WORK); locs=coll(LOC)
          source_objs,source_meshes=import_glb(source_glb,source,'LOCKED_BIGANT_A01_RETAIL_DONOR',92)
          work_objs,work_meshes=import_glb(work_glb,work,'DTC_EDITABLE_DERIVATIVE',16)
          for o in source_objs:o.hide_select=True
          source.hide_render=True; source.hide_viewport=True; source['dtc.locked_source']=True; source['dtc.evidence_domain']='COMPARATIVE TITLE DIRECT'; source['dtc.coordinate_basis']='DTC_X_FORWARD_Y_LEFT_Z_UP_METRES'
          for o in work_objs:o.hide_select=False; o['dtc.editable']=True; o['dtc.physics_authority']='NONE_G2_003_OWNS_SIMULATION'
          work['dtc.editable']=True; work['dtc.coordinate_basis']='DTC_X_FORWARD_Y_LEFT_Z_UP_METRES'; work['dtc.physics_authority']='NONE_G2_003_OWNS_SIMULATION'
          nloc=0
          for item in json.loads(loc_json.read_text()):
              if item.get('has_render_geometry'): continue
              o=bpy.data.objects.new('LOC_'+item['name'],None); o.empty_display_type='PLAIN_AXES'; o.empty_display_size=0.08; o.location=item['dtc_xyz_m']; o['dtc.locator_source_name']=item['name']; o['dtc.evidence_domain']='COMPARATIVE TITLE DIRECT'; o['dtc.locator_status']='DONOR_REFERENCE_NOT_SIM_AUTHORITY'; locs.objects.link(o); nloc+=1
          locs['dtc.coordinate_basis']='DTC_X_FORWARD_Y_LEFT_Z_UP_METRES'; locs['dtc.physics_authority']='NONE_G2_003_OWNS_SIMULATION'
          scene['dtc.donor_source']='Big Ant 2010 retail A01 SprintCar shaded PSSG'; scene['dtc.source_pssg_sha256']=SHA; scene['dtc.evidence_domain']='COMPARATIVE TITLE DIRECT'; scene['dtc.production_rule']='Edit DTC_SPRINT_A_WORK only; SOURCE_BIGANT_A01_LOCKED is forensic source.'; scene['dtc.source_mesh_objects']=len(source_meshes); scene['dtc.work_mesh_objects']=len(work_meshes); scene['dtc.reference_locators']=nloc
          bpy.ops.object.select_all(action='DESELECT')
          for o in work_meshes:o.select_set(True)
          if work_meshes:bpy.context.view_layer.objects.active=work_meshes[0]
          bpy.ops.wm.save_as_mainfile(filepath=str(out)); print(f'A01_BLEND_BUILD_PASS source_meshes={len(source_meshes)} work_meshes={len(work_meshes)} locators={nloc} out={out}')
          PY
          "$BLENDER" --background --python /tmp/stage_a01.py

      - name: Validate immutable v01 base
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/validate_a01_blend.py <<'PY'
          import bpy
          s=bpy.data.collections.get('SOURCE_BIGANT_A01_LOCKED'); w=bpy.data.collections.get('DTC_SPRINT_A_WORK'); l=bpy.data.collections.get('DTC_SPRINT_A_LOCATORS')
          assert s is not None and w is not None and l is not None
          sm=[o for o in s.objects if o.type=='MESH']; wm=[o for o in w.objects if o.type=='MESH']
          assert len(sm)==92,len(sm); assert len(wm)==16,len(wm); assert s.get('dtc.locked_source') is True; assert w.get('dtc.editable') is True
          assert bpy.context.scene.get('dtc.source_pssg_sha256')=='6621074f3048a4ee41606c6fd15b501bc3fd8723a423ee9a0b7368fb4f428bd6'
          assert not ({id(o.data) for o in sm} & {id(o.data) for o in wm})
          print(f'A01_BLENDER_STAGE_PASS source_meshes={len(sm)} work_meshes={len(wm)} locators={len(l.objects)}')
          PY
          "$BLENDER" --background "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend" --python /tmp/validate_a01_blend.py
          sha256sum "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend" | tee "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend.sha256"
          BASE_BLEND_SHA="$(sha256sum "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend" | awk '{print $1}')"
          echo "BASE_BLEND_SHA=$BASE_BLEND_SHA" >> "$GITHUB_ENV"
          cp /tmp/a01_out/A01_real_donor_extraction_report.json "$GITHUB_WORKSPACE/"
          cp /tmp/a01_out/A01_top_level_locators.json "$GITHUB_WORKSPACE/"

      - name: Apply Blender 5.2 proof-render compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/modify_a01_to_dtc_v02_blender.py')
          s=p.read_text()
          old='    scene.display.shading.single_color = (0.36, 0.37, 0.40)\n    scene.world.color = (0.055, 0.055, 0.055)\n'
          new='    scene.display.shading.single_color = (0.36, 0.37, 0.40)\n    if scene.world is None:\n        scene.world = bpy.data.worlds.new("DTC_PROOF_WORLD")\n    scene.world.color = (0.055, 0.055, 0.055)\n'
          assert old in s
          p.write_text(s.replace(old,new))
          PY

      - name: Create reversible DTC v02 modification pass
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/renders_v01" "$GITHUB_WORKSPACE/renders_v02"
          "$BLENDER" --background \
            --python "$GITHUB_WORKSPACE/.github/scripts/modify_a01_to_dtc_v02_blender.py" -- \
            --in "$GITHUB_WORKSPACE/DTC_BIGANT_A01_DONOR_v01.blend" \
            --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" \
            --baseline-render-dir "$GITHUB_WORKSPACE/renders_v01" \
            --render-dir "$GITHUB_WORKSPACE/renders_v02" \
            --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02_mod_report.json" \
            --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.glb"
          sha256sum "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" | tee "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend.sha256"
          sha256sum "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.glb" | tee "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.glb.sha256"

      - name: Validate v02 rollback and edit boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/validate_v02.py <<'PY'
          import bpy, os
          source=bpy.data.collections.get('SOURCE_BIGANT_A01_LOCKED')
          work=bpy.data.collections.get('DTC_SPRINT_A_WORK')
          backup=bpy.data.collections.get('DTC_SPRINT_A_BASELINE_V01')
          guides=bpy.data.collections.get('DTC_WOO_REFERENCE_GUIDES_V02')
          assert all(x is not None for x in (source,work,backup,guides))
          sm=[o for o in source.objects if o.type=='MESH']
          wm=[o for o in work.objects if o.type=='MESH']
          bm=[o for o in backup.objects if o.type=='MESH']
          assert len(sm)==92,len(sm)
          assert len(wm)==16,len(wm)
          assert len(bm)==16,len(bm)
          assert source.get('dtc.locked_source') is True
          assert backup.get('dtc.locked_backup') is True
          assert bpy.context.scene.get('dtc.base_blend_sha256')==os.environ['BASE_BLEND_SHA']
          modified=[o for o in wm if o.get('dtc.v02_modified') is True]
          names=sorted(o.name for o in modified)
          assert len(modified)==5,names
          assert sum(n.startswith('TopWing_LOD0_DMG0') for n in names)==2,names
          for p in ('FrontWing_LOD0_DMG0','BumperLeft_DMG0_LOD0','BumperRight_DMG0_LOD0'):
              assert sum(n.startswith(p) for n in names)==1,(p,names)
          for p in ('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0','Frame_LOD0','Frame_engine_struts_LOD0','Driver_LOD0','SteeringWheel_LOD0'):
              hits=[o for o in wm if o.name.startswith(p)]
              assert hits and all(o.get('dtc.v02_modified') is False for o in hits),p
          assert not ({id(o.data) for o in wm} & {id(o.data) for o in bm})
          print('DTC_SPRINT_A_V02_BOUNDARY_PASS',names,'guides',len(guides.objects),'base',os.environ['BASE_BLEND_SHA'])
          PY
          "$BLENDER" --background "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" --python /tmp/validate_v02.py

      - name: Build v01-v02 visual comparison montage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageOps
          from pathlib import Path
          root=Path('.')
          views=['LEFT_SIDE','FRONT_3_4','TOP']
          cell=(900,650); header=42
          canvas=Image.new('RGB',(cell[0]*2,(cell[1]+header)*3),(24,24,24))
          draw=ImageDraw.Draw(canvas)
          for row,v in enumerate(views):
              for col,(folder,prefix,title) in enumerate([
                  ('renders_v01','V01_BASE','v01 untouched A01 donor'),
                  ('renders_v02','V02_MOD','v02 DTC first modification'),
              ]):
                  im=Image.open(root/folder/f'{prefix}_{v}.png').convert('RGB')
                  im=ImageOps.fit(im,cell)
                  x=col*cell[0]; y=row*(cell[1]+header)
                  canvas.paste(im,(x,y+header))
                  draw.text((x+12,y+12),f'{title} — {v}',fill=(240,240,240))
          out=root/'DTC_SPRINT_A_v01_vs_v02_MONTAGE.png'
          canvas.save(out)
          print(out)
          PY

      - name: Upload v01 and v02 proof package
        uses: actions/upload-artifact@v4
        with:
          name: dtc-sprint-a-v02-proof
          path: |
            DTC_BIGANT_A01_DONOR_v01.blend
            DTC_BIGANT_A01_DONOR_v01.blend.sha256
            DTC_SPRINT_A_v02.blend
            DTC_SPRINT_A_v02.blend.sha256
            DTC_SPRINT_A_v02.glb
            DTC_SPRINT_A_v02.glb.sha256
            DTC_SPRINT_A_v02_mod_report.json
            DTC_SPRINT_A_v01_vs_v02_MONTAGE.png
            renders_v01/*.png
            renders_v02/*.png
            A01_real_donor_extraction_report.json
            A01_top_level_locators.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
