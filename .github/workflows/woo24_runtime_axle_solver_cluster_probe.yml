name: WoO24 runtime axle solver cluster probe
# registered

on:
  push:
    paths:
      - '.github/workflows/woo24_runtime_axle_solver_cluster_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Find runtime tyre-law consumers by axle-offset clusters
        shell: bash
        run: |
          set -euxo pipefail
          unzip -q phys.zip -d woo24_phys
          python3 -m pip install --disable-pip-version-check --quiet pefile capstone

          python3 - <<'PY'
          import bisect, collections, re
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM

          pe=pefile.PE('woo24_phys/physimpl.dll',fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase
          pe.parse_data_directories()
          funcs=sorted((base+e.struct.BeginAddress,base+e.struct.EndAddress)
                       for e in pe.DIRECTORY_ENTRY_EXCEPTION if e.struct.EndAddress>e.struct.BeginAddress)
          starts=[a for a,b in funcs]
          def fn(a):
            i=bisect.bisect_right(starts,a)-1
            return funcs[i] if i>=0 and funcs[i][0]<=a<funcs[i][1] else None

          text=next(s for s in pe.sections if s.Name.rstrip(b'\0')==b'.text')
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True; md.skipdata=True
          ins=list(md.disasm(pe.get_data(text.VirtualAddress,max(text.Misc_VirtualSize,text.SizeOfRawData)),base+text.VirtualAddress))

          # Runtime axle offsets established from constructor 0x18007CBD0.
          fields={
            0x5C:'friction',
            0x60:'moment',
            0x70:'magic_b',0x74:'magic_c',0x78:'magic_d',0x7C:'magic_e',
            0x80:'frict_load1',0x84:'frict_k1',0x88:'frict_load2',0x8C:'frict_k2',
            0x90:'stiff_load1',0x94:'stiff_c1',0x98:'stiff_load2',0x9C:'stiff_c2',
            0xA0:'camber_stiff',0xA4:'camber_peak',0xA8:'camber_grip',
            0xAC:'long_stiff',0xB0:'long_frict',
            0xB4:'grip_fade_start',0xB8:'grip_fade_stop',0xBC:'grip_fade',0xC0:'ref_width',
          }
          target_offsets=set(fields)

          # For every function, group reads by memory base register. A real axle-law
          # consumer should touch several target offsets through the same base reg.
          byfunc=collections.defaultdict(lambda: collections.defaultdict(list))
          for x in ins:
            f=fn(x.address)
            if not f or getattr(x,'id',0)==0: continue
            for op in x.operands:
              if op.type != X86_OP_MEM: continue
              disp=op.mem.disp
              if disp in target_offsets and op.mem.base != 0:
                byfunc[f][op.mem.base].append((x.address,disp,x.mnemonic,x.op_str))

          scored=[]
          for f,bases in byfunc.items():
            for reg,hits in bases.items():
              distinct={d for _,d,_,_ in hits}
              # demand a meaningful cluster; 4+ tyre-law fields is unlikely accidental
              if len(distinct)>=4:
                score=len(distinct)*100+len(hits)
                scored.append((score,f,reg,distinct,hits))
          scored.sort(reverse=True)

          print("WOO24 RUNTIME AXLE TYRE-LAW CLUSTER PROBE")
          print("="*100)
          print("candidates",len(scored))
          for rank,(score,f,reg,distinct,hits) in enumerate(scored[:40]):
            print(f"\nCANDIDATE {rank} score={score} func=0x{f[0]:X}-0x{f[1]:X} size={f[1]-f[0]} baseReg={reg}")
            print("fields",[(hex(d),fields[d]) for d in sorted(distinct)])
            for a,d,m,o in hits[:120]:
              print(f"  0x{a:X} {m:<8} {o:<48} ; {fields[d]}")

          # Disassemble top candidate functions completely, with target-offset labels.
          top=[]
          for _,f,_,_,_ in scored:
            if f not in top: top.append(f)
            if len(top)>=10: break
          md2=Cs(CS_ARCH_X86,CS_MODE_64); md2.detail=True
          for i,f in enumerate(top):
            print(f"\n### FULL CANDIDATE FUNCTION {i}: 0x{f[0]:X}-0x{f[1]:X} size={f[1]-f[0]}")
            for x in md2.disasm(pe.get_data(f[0]-base,f[1]-f[0]),f[0]):
              labs=[]
              for op in x.operands:
                if op.type==X86_OP_MEM and op.mem.disp in target_offsets:
                  labs.append(fields[op.mem.disp])
              print(f"0x{x.address:X}: {x.mnemonic:<8} {x.op_str}" + ((" ; "+",".join(labs)) if labs else ""))

          # Native strings close to likely tyre functions for context.
          raw=open('woo24_phys/physimpl.dll','rb').read()
          print("\nRELEVANT SOURCE/DIAGNOSTIC STRINGS")
          for m in re.finditer(rb'[ -~]{5,}',raw):
            s=m.group().decode('ascii','ignore')
            if re.search(r'tire\.cpp|tyre|tire|stiff|frict|slip|selfalign|magic|camber|long_stiff|ref_width',s,re.I):
              print(s[:1000])
          PY
