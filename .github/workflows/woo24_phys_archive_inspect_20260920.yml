name: WoO24 phys archive inspect 20260920

on:
  push:
    paths:
      - '.github/workflows/woo24_phys_archive_inspect_20260920.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inventory phys.zip
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out phys_unpack
          mkdir -p out phys_unpack
          sha256sum phys.zip | tee out/hash.txt
          unzip -l phys.zip | tee out/list.txt
          unzip -q phys.zip -d phys_unpack
          {
            echo '=== FILE TYPES ==='
            find phys_unpack -type f -print0 | xargs -0 file
            echo
            echo '=== NAMES / PHYSICS TERMS ==='
            grep -aRniE 'Sprint410|Sprint.?410|CarPhysics|PhysAxle|PhysWheel|PhysChassis|PhysEngine|PhysTransmission|PhysicsPrefab|ChassisInfo|front_axle|rear_axle|grip_lf|long_frict|magic_b' phys_unpack | head -4000 || true
          } | tee out/inspect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-phys-archive-inspect
          path: out/
          retention-days: 1
