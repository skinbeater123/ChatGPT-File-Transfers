name: WoO24 ref_width B8 translator tail

on:
  push:
    paths:
      - '.github/workflows/woo24_ref_width_b8_translator_tail_20260920.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - name: Trace source B8 through translator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out
          mkdir -p phys_unpack out
          unzip -q phys.zip -d phys_unpack
          python - <<'PY'
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM
          p='phys_unpack/physimpl.dll'; pe=pefile.PE(p); raw=open(p,'rb').read(); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          # Decode from known-good function start far enough to full return.
          start=0x18007cbd0; off=pe.get_offset_from_rva(start-base)
          ins=list(md.disasm(raw[off:off+0x1200],start))
          first=[]
          for i in ins:
            first.append(i)
            if i.mnemonic=='ret' and i.address>start+0x20: break
          with open('out/translator_full.txt','w') as f:
            for i in first:f.write(f'{i.address:#018x}: {i.mnemonic:8s} {i.op_str}\n')
          with open('out/source_b8_focus.txt','w') as f:
            for idx,i in enumerate(first):
              hit=False
              for op in i.operands:
                if op.type==X86_OP_MEM and op.mem.disp in (0xb4,0xb8,0xbc):
                  hit=True
              if hit:
                f.write(f'\nTARGET {i.address:#x}: {i.mnemonic} {i.op_str}\n')
                for q in first[max(0,idx-16):min(len(first),idx+35)]:
                  f.write(f'  {q.address:#018x}: {q.mnemonic:8s} {q.op_str}\n')
          PY
          dest="forensics/woo24_ref_width_b8_translator_tail_20260920"
          rm -rf "$dest"; mkdir -p "$dest"; cp out/* "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"; git commit -m "forensics: publish WoO24 ref_width B8 translator tail"; git push
