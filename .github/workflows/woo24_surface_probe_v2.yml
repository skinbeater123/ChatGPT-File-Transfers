name: WoO24 surface trace v2

on:
  push:
    paths:
      - '.github/workflows/woo24_surface_probe_v2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p woo24_input woo24_dump woo24_probe
          unzip -q WOO24.zip -d woo24_input
      - name: Build metadata dumper
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/Il2CppDumper/Il2CppDumper/config.json')
          j=json.loads(p.read_text(encoding='utf-8-sig'))
          j.update({'RequireAnyKey':False,'DumpMethod':True,'DumpField':True,'DumpProperty':True,'DumpAttribute':True,'DumpFieldOffset':True,'DumpMethodOffset':True,'DumpTypeDefIndex':True,'GenerateDummyDll':True})
          p.write_text(json.dumps(j,indent=2),encoding='utf-8')
          PY
          dotnet build /tmp/Il2CppDumper/Il2CppDumper/Il2CppDumper.csproj -c Release -f net8.0 >/dev/null
          GAME=$(find woo24_input -type f -iname 'GameAssembly.dll' | head -1)
          META=$(find woo24_input -type f -iname 'global-metadata.dat' | head -1)
          DUMPER=$(find /tmp/Il2CppDumper/Il2CppDumper/bin/Release/net8.0 -type f -name 'Il2CppDumper.dll' | head -1)
          cp /tmp/Il2CppDumper/Il2CppDumper/config.json "$(dirname "$DUMPER")/config.json"
          dotnet "$DUMPER" "$GAME" "$META" "$PWD/woo24_dump" > woo24_probe/il2cppdumper.log
      - name: Run bounded surface trace
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pefile capstone
          python3 .github/scripts/woo24_surface_probe_v2.py --root "$PWD/woo24_input" --dump "$PWD/woo24_dump" --out "$PWD/woo24_probe"
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-il2cpp-surface-probe-v2
          path: |
            woo24_probe/surface_trace_v2.txt
            woo24_probe/il2cppdumper.log
          retention-days: 1
