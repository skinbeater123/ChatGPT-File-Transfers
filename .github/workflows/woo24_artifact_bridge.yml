name: A01 sprint car archive bridge

on:
  push:
    paths:
      - '.github/workflows/woo24_artifact_bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover pinned a01_sprintcar.zip
        shell: bash
        run: |
          set -euxo pipefail
          git show 42cb79bc8e459e40ab920e2235b55fbf57d3ca07:a01_sprintcar.zip > a01_sprintcar-pinned.zip
          sha256sum a01_sprintcar-pinned.zip > a01_sprintcar-pinned.sha256
          unzip -l a01_sprintcar-pinned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bigant-a01-sprintcar-pinned
          path: |
            a01_sprintcar-pinned.zip
            a01_sprintcar-pinned.sha256
          retention-days: 1
