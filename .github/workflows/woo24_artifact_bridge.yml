name: WoO24 supplied archive bridge

on:
  push:
    paths:
      - '.github/workflows/woo24_artifact_bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover pinned globalgamemanagers.zip
        shell: bash
        run: |
          set -euxo pipefail
          git show 8c701f06dbd0116338bca2f9853b33a8bdd17101:globalgamemanagers.zip > globalgamemanagers-pinned.zip
          sha256sum globalgamemanagers-pinned.zip > globalgamemanagers-pinned.sha256
          unzip -l globalgamemanagers-pinned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-globalgamemanagers-pinned
          path: |
            globalgamemanagers-pinned.zip
            globalgamemanagers-pinned.sha256
          retention-days: 1
