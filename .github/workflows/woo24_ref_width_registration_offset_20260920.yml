name: WoO24 ref_width registration offset trace

on:
  push:
    paths:
      - '.github/workflows/woo24_ref_width_registration_offset_20260920.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - name: Trace schema registration and translator constants
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out
          mkdir -p phys_unpack out
          unzip -q phys.zip -d phys_unpack
          python - <<'PY'
          import pefile, struct
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          p='physimpl.dll'
          p='phys_unpack/'+p
          pe=pefile.PE(p); raw=open(p,'rb').read(); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          def disasm(a,b):
              off=pe.get_offset_from_rva(a-base)
              return list(md.disasm(raw[off:off+(b-a)],a))
          with open('out/registration.txt','w') as f:
              for i in disasm(0x180038d80,0x180039080):
                  f.write(f'{i.address:#018x}: {i.mnemonic:8s} {i.op_str}\n')
          # translator plus annotate RIP float constants
          ins=disasm(0x18007cbd0,0x18007ceb6)
          with open('out/translator_annotated.txt','w') as f:
              for i in ins:
                  anns=[]
                  for op in i.operands:
                      if op.type==3 and op.mem.base==41: # RIP in capstone x86 enum commonly 41
                          va=i.address+i.size+op.mem.disp
                          try:
                              off=pe.get_offset_from_rva(va-base)
                              fv=struct.unpack_from('<f',raw,off)[0]
                              anns.append(f'RIPVA={va:#x} float={fv!r}')
                          except: pass
                  f.write(f'{i.address:#018x}: {i.mnemonic:8s} {i.op_str} {" ".join(anns)}\n')
          PY
          dest="forensics/woo24_ref_width_registration_offset_20260920"
          rm -rf "$dest"; mkdir -p "$dest"; cp out/* "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"; git commit -m "forensics: publish WoO24 ref_width registration offset"; git push
