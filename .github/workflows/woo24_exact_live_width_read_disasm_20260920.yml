name: WoO24 exact live width read disasm 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_exact_live_width_read_disasm_20260920.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euxo pipefail
          rm -rf phys_unpack out_exactlive
          mkdir -p phys_unpack out_exactlive
          unzip -q phys.zip -d phys_unpack
          python - <<'PY' | tee out_exactlive/summary.txt
          import pefile,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM
          p='phys_unpack/physimpl.dll';raw=open(p,'rb').read();pe=pefile.PE(p);base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True;md.skipdata=True
          ins=[]
          for s in pe.sections:
            if s.Characteristics & 0x20000000:
              ins.extend(md.disasm(raw[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],base+s.VirtualAddress))
          funcs=[]
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_EXCEPTION']])
          for e in pe.DIRECTORY_ENTRY_EXCEPTION: funcs.append((base+e.struct.BeginAddress,base+e.struct.EndAddress))
          funcs.sort()
          def fn(a):
            k=bisect.bisect_right(funcs,(a,2**64-1))-1
            return funcs[k] if k>=0 and funcs[k][0]<=a<funcs[k][1] else None
          targets=[0x1800227d8,0x180022888,0x1800c6ff9,0x1800c7028]
          # all direct calls reverse map
          rev={}
          for i in ins:
            if i.mnemonic=='call':
              try:
                if i.operands and i.operands[0].type==X86_OP_IMM:
                  rev.setdefault(i.operands[0].imm,[]).append(i.address)
              except:pass
          with open('out_exactlive/functions.txt','w') as o:
            seen=set()
            for a in targets:
              f=fn(a); print(hex(a),'fn',f)
              if not f or f in seen:continue
              seen.add(f)
              o.write(f'\n===== target(s) in FUNCTION {f[0]:#x}-{f[1]:#x} callers={[hex(x) for x in rev.get(f[0],[])]} =====\n')
              for q in ins:
                if f[0]<=q.address<f[1]:
                  o.write(f'{q.address:#018x}: {q.mnemonic:8s} {q.op_str}\n')
              # caller funcs first 5
              for ca in rev.get(f[0],[])[:5]:
                cf=fn(ca)
                o.write(f'\n--- CALLER @{ca:#x} fn={cf} ---\n')
                if cf:
                  for q in ins:
                    if cf[0]<=q.address<cf[1]: o.write(f'{q.address:#018x}: {q.mnemonic:8s} {q.op_str}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-exact-live-width-read-disasm
          path: out_exactlive/
          retention-days: 3
      - shell: bash
        run: |
          set -euxo pipefail
          rm -rf forensics_output/woo24_exact_live_width_read_disasm_20260920
          mkdir -p forensics_output/woo24_exact_live_width_read_disasm_20260920
          cp out_exactlive/* forensics_output/woo24_exact_live_width_read_disasm_20260920/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensics_output/woo24_exact_live_width_read_disasm_20260920
          git commit -m "forensics: publish WoO24 exact live width read disasm" || exit 0
          git push
