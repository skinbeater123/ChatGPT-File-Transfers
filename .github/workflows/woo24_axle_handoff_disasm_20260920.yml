name: WoO24 axle handoff disasm 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_axle_handoff_disasm_20260920.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out5
          mkdir -p phys_unpack out5
          unzip -q phys.zip -d phys_unpack
          python - <<'PY' | tee out5/handoff_disasm.txt
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          p='phys_unpack/physimpl.dll'; raw=open(p,'rb').read(); pe=pefile.PE(p); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          for rva,n in [(0x3cf60,0x300),(0x3d000,0x260)]:
              o=pe.get_offset_from_rva(rva)
              print(f'===== RVA {rva:#x} =====')
              for i in md.disasm(raw[o:o+n],base+rva):
                  print(f'{i.address:#018x}: {i.mnemonic:8s} {i.op_str}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-axle-handoff-disasm
          path: out5/
          retention-days: 3
