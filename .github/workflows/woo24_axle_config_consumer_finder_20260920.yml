name: WoO24 axle config consumer finder 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_axle_config_consumer_finder_20260920.yml'
      - '.github/scripts/woo24_axle_config_consumer_finder.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out6
          mkdir -p phys_unpack out6
          unzip -q phys.zip -d phys_unpack
          python .github/scripts/woo24_axle_config_consumer_finder.py phys_unpack/physimpl.dll out6 | tee out6/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-axle-config-consumer-finder
          path: out6/
          retention-days: 3
