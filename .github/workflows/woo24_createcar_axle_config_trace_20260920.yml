name: WoO24 createcar axle-config trace 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_createcar_axle_config_trace_20260920.yml'
      - '.github/scripts/woo24_createcar_axle_config_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out12
          mkdir -p phys_unpack out12
          unzip -q phys.zip -d phys_unpack
          python .github/scripts/woo24_createcar_axle_config_trace.py phys_unpack/physimpl.dll out12 | tee out12/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-createcar-axle-config-trace
          path: out12/
          retention-days: 3
