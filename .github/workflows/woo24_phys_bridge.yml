name: WoO24 phys bridge

on:
  push:
    paths:
      - '.github/workflows/woo24_phys_bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover pinned phys.zip
        shell: bash
        run: |
          set -euxo pipefail
          git show d2cbf94fe71b69835578fd59a3d6791916620b8f:phys.zip > phys-pinned.zip
          sha256sum phys-pinned.zip > phys-pinned.sha256
          unzip -l phys-pinned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-phys-pinned
          path: |
            phys-pinned.zip
            phys-pinned.sha256
          retention-days: 1
# trigger pinned-phys bridge
