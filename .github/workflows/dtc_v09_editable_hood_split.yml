name: DTC v09 practical editable hood split

on:
  push:
    paths:
      - '.github/workflows/dtc_v09_editable_hood_split.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact v08 authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh run download 33507580090 --repo skinbeater123/ChatGPT-File-Transfers -n dtc-sprint-a-v08-native-hood-component-stage -D base
          echo 'ad9080c7bc7b9475547edda3ad1eb2ca9fabed6cbd2341b2ac339683b32a6456  base/DTC_SPRINT_A_v08_HOOD_COMPONENT_STAGE.blend' | sha256sum -c -
      - name: Compile builder
        run: python -m py_compile .github/scripts/dtc_v09_editable_hood_split.py
      - name: Install Blender 5.2.1
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.1-linux-x64/blender --version
      - name: Build v09 practical modelling stage
        run: |
          mkdir -p out
          ./blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python .github/scripts/dtc_v09_editable_hood_split.py -- \
            --blend base/DTC_SPRINT_A_v08_HOOD_COMPONENT_STAGE.blend \
            --out-blend out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.blend \
            --report out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT_report.json
          grep -q '"status": "V09_NATIVE_BUILD_PASS"' out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT_report.json
      - name: Fresh reload validation
        run: |
          cat > /tmp/validate_v09.py <<'PY'
          import bpy,json,sys
          from pathlib import Path
          a=sys.argv[sys.argv.index('--')+1:]
          blend,report=Path(a[0]),Path(a[1])
          bpy.ops.wm.open_mainfile(filepath=str(blend)); r=json.loads(report.read_text()); s=bpy.context.scene
          assert s['dtc.asset_version']=='DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT'
          assert bool(s['dtc.production_hood_cut']) is True
          assert bool(s['dtc.forensic_hood_boundary_claim']) is False
          body=bpy.data.objects['DTC_Body_LOD0']; hood=bpy.data.objects['DTC_Hood']; rb=bpy.data.collections['DTC_SPRINT_A_BASELINE_V08_PRACTICAL']
          assert len(hood.data.polygons)==438
          assert len(body.data.polygons)==r['result']['body_faces']
          assert len(body.data.polygons)+len(hood.data.polygons)==r['result']['face_total']==r['source']['faces']
          assert len([o for o in rb.objects if o.type=='MESH'])==16 and rb.hide_viewport and rb.hide_render
          assert r['result']['face_geometry_conserved_exactly'] and r['result']['body_hood_overlap_faces']==0
          print('DTC_SPRINT_A_V09_FRESH_RELOAD_PASS')
          PY
          ./blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python /tmp/validate_v09.py -- out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.blend out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT_report.json
      - name: Hash artifact
        run: sha256sum out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.blend | tee out/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.sha256
      - name: Upload v09 authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtc-sprint-a-v09-editable-hood-split
          path: out/
          retention-days: 1
