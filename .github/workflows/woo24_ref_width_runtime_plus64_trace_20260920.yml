name: WoO24 ref_width runtime plus64 trace 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_ref_width_runtime_plus64_trace_20260920.yml'
      - '.github/scripts/woo24_ref_width_runtime_plus64_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out7
          mkdir -p phys_unpack out7
          unzip -q phys.zip -d phys_unpack
          python .github/scripts/woo24_ref_width_runtime_plus64_trace.py phys_unpack/physimpl.dll out7 | tee out7/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-ref-width-runtime-plus64-trace
          path: out7/
          retention-days: 3
