name: A01 v03 pivot and v04 proof local2
on:
  push:
    paths:
      - '.github/workflows/a01_v03_v04_pivot_proof_local2.yml'
jobs:
  prove:
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact validated v02
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v02proof
          gh run download 33459151354 --repo "$GITHUB_REPOSITORY" -n dtc-sprint-a-v02-proof -D /tmp/v02proof
          cp /tmp/v02proof/DTC_SPRINT_A_v02.blend .
          test "$(sha256sum DTC_SPRINT_A_v02.blend|awk '{print $1}')" = 87d9424831aba0f46626e25642f1c7467bde62b2df10fcb5c152f22a3ce95f9d
      - name: Blender 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          echo BLENDER=/tmp/blender-5.2.1-linux-x64/blender >> "$GITHUB_ENV"
          python -m py_compile .github/scripts/modify_a01_v02_to_dtc_v03_hardpoints.py .github/scripts/modify_a01_v03_to_dtc_v04_cockpit_packaging.py
      - name: Build corrected v03
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --python .github/scripts/modify_a01_v02_to_dtc_v03_hardpoints.py -- --in "$GITHUB_WORKSPACE/DTC_SPRINT_A_v02.blend" --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.blend" --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT_report.json" --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.glb"
          sha256sum DTC_SPRINT_A_v03_HARDPOINT.blend|tee DTC_SPRINT_A_v03_HARDPOINT.blend.sha256
          sha256sum DTC_SPRINT_A_v03_HARDPOINT.glb|tee DTC_SPRINT_A_v03_HARDPOINT.glb.sha256
      - name: Validate corrected v03
        shell: bash
        run: |
          cat >/tmp/v03check.py <<'PY'
          import bpy
          I=.0254;T=1e-6; w=bpy.data.collections['DTC_SPRINT_A_WORK']; s=bpy.data.collections['SOURCE_BIGANT_A01_LOCKED']; b1=bpy.data.collections['DTC_SPRINT_A_BASELINE_V01']; b2=bpy.data.collections['DTC_SPRINT_A_BASELINE_V02']
          mm=lambda c:[o for o in c.objects if o.type=='MESH']; assert [len(mm(x)) for x in(s,w,b1,b2)]==[92,16,16,16]; assert s.get('dtc.locked_source') is True and b1.get('dtc.locked_backup') is True and b2.get('dtc.locked_backup') is True; assert bpy.context.scene.get('dtc.asset_version')=='DTC_SPRINT_A_v03_HARDPOINT'; assert not({id(o.data) for o in mm(w)}&{id(o.data) for o in mm(b2)})
          def one(p): a=[o for o in mm(w) if o.name.startswith(p)];assert len(a)==1;return a[0]
          lf,rf,lr,rr=[one(p) for p in('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0')]; wb=(lf.matrix_world.translation.x+rf.matrix_world.translation.x-lr.matrix_world.translation.x-rr.matrix_world.translation.x)/2; ft=lf.matrix_world.translation.y-rf.matrix_world.translation.y; rt=lr.matrix_world.translation.y-rr.matrix_world.translation.y
          assert abs(wb-85.4193*I)<T and abs(ft-55.4295*I)<T and abs(rt-52.7976*I)<T
          for o in(lf,rf,lr,rr): assert o.get('dtc.v03_pivot_relocated') is True and float(o.get('dtc.v03_pivot_error_m'))<T
          ch=sorted(o.name for o in mm(w) if o.get('dtc.v03_modified') is True);assert len(ch)==7,ch
          print('V03_PIVOT_PASS',wb,ft,rt,ch)
          PY
          "$BLENDER" --background DTC_SPRINT_A_v03_HARDPOINT.blend --python /tmp/v03check.py
      - name: Build v04 from corrected v03
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --python .github/scripts/modify_a01_v03_to_dtc_v04_cockpit_packaging.py -- --in "$GITHUB_WORKSPACE/DTC_SPRINT_A_v03_HARDPOINT.blend" --out "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend" --report "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING_report.json" --export-glb "$GITHUB_WORKSPACE/DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb"
          sha256sum DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend|tee DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend.sha256
          sha256sum DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb|tee DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb.sha256
      - name: Validate v04 and retained pivots
        shell: bash
        run: |
          cat >/tmp/v04check.py <<'PY'
          import bpy
          I=.0254;T=1e-6; w=bpy.data.collections['DTC_SPRINT_A_WORK']; bs=[bpy.data.collections[n] for n in('DTC_SPRINT_A_BASELINE_V01','DTC_SPRINT_A_BASELINE_V02','DTC_SPRINT_A_BASELINE_V03')]; mm=lambda c:[o for o in c.objects if o.type=='MESH'];assert len(mm(w))==16 and [len(mm(x)) for x in bs]==[16,16,16] and all(x.get('dtc.locked_backup') is True for x in bs);assert bpy.context.scene.get('dtc.asset_version')=='DTC_SPRINT_A_v04_COCKPIT_PACKAGING';assert not({id(o.data) for o in mm(w)}&{id(o.data) for o in mm(bs[2])})
          def one(p):a=[o for o in mm(w) if o.name.startswith(p)];assert len(a)==1;return a[0]
          lf,rf,lr,rr=[one(p) for p in('WheelLF_LOD0','WheelRF_LOD0','WheelLR_LOD0','WheelRR_LOD0')];wb=(lf.matrix_world.translation.x+rf.matrix_world.translation.x-lr.matrix_world.translation.x-rr.matrix_world.translation.x)/2;ft=lf.matrix_world.translation.y-rf.matrix_world.translation.y;rt=lr.matrix_world.translation.y-rr.matrix_world.translation.y;assert abs(wb-85.4193*I)<T and abs(ft-55.4295*I)<T and abs(rt-52.7976*I)<T;ch=sorted(o.name for o in mm(w) if o.get('dtc.v04_modified') is True);assert len(ch)==3,ch;print('V04_RETAINED_PIVOTS_PASS',wb,ft,rt,ch)
          PY
          "$BLENDER" --background DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend --python /tmp/v04check.py
      - uses: actions/upload-artifact@v4
        with:
          name: dtc-sprint-a-v03-v04-pivot-proof-final
          retention-days: 1
          compression-level: 0
          path: |
            DTC_SPRINT_A_v03_HARDPOINT.blend
            DTC_SPRINT_A_v03_HARDPOINT.blend.sha256
            DTC_SPRINT_A_v03_HARDPOINT.glb
            DTC_SPRINT_A_v03_HARDPOINT.glb.sha256
            DTC_SPRINT_A_v03_HARDPOINT_report.json
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.blend.sha256
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING.glb.sha256
            DTC_SPRINT_A_v04_COCKPIT_PACKAGING_report.json
