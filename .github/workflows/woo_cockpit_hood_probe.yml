name: WoO cockpit hood witness probe

on:
  push:
    paths:
      - '.github/workflows/woo_cockpit_hood_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and probe exact retail Global.pre
        run: |
          set -euo pipefail
          test "$(stat -c%s Global.pre)" = "12401519"
          test "$(sha256sum Global.pre | awk '{print $1}')" = "6219282c663faca7bde0ef955d864aee2aa6cde85532f1614da8517ae9f61289"
          python -m py_compile .github/scripts/woo_cockpit_hood_probe_v2.py
          python .github/scripts/woo_cockpit_hood_probe_v2.py Global.pre reports/woo_cockpit_hood_probe_v2_20260901.json
          python - <<'PY'
          import json
          p='reports/woo_cockpit_hood_probe_v2_20260901.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['source_sha256']=='6219282c663faca7bde0ef955d864aee2aa6cde85532f1614da8517ae9f61289'
          print('COCKPIT_MESHFILES',d['cockpit_meshfile_count'])
          print('GEOMETRY_CANDIDATES',d['geometry_candidate_count'])
          print('ORDINAL_MAPPING',d['ordinal_mapping_authority'])
          print('HOOD_MESHFILES',d['hood_meshfiles'])
          print('WITNESS_DECISION',d['witness_decision'])
          PY
      - name: Commit derived report only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/woo_cockpit_hood_probe_v2_20260901.json
          git commit -m "Record targeted WoO cockpit hood geometry probe" || exit 0
          git push
