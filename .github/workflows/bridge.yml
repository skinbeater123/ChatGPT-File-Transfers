name: ChatGPT binary bridge

on:
  push:
    paths:
      - '.github/workflows/bridge.yml'

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v4
      - name: Upload 2010 KKR Maxim archive
        uses: actions/upload-artifact@v4
        with:
          name: kkr-maxim-transfer
          path: '2010 KKR Maxim.zip'
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
