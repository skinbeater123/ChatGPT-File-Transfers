name: ChatGPT binary bridge

on:
  push:
    paths:
      - '.github/workflows/bridge.yml'

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v4
      - name: Upload A01 sprint car archive
        uses: actions/upload-artifact@v4
        with:
          name: a01-sprintcar-transfer
          path: 'a01_sprintcar.zip'
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
