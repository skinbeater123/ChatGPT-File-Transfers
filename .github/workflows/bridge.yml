name: ChatGPT binary bridge

on:
  push:
    paths:
      - '.github/workflows/bridge.yml'

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v4
      - name: Upload Sprint Car Project split archive
        uses: actions/upload-artifact@v4
        with:
          name: sprint-car-project-transfer
          path: |
            Sprint Car Project.zip.001
            Sprint Car Project.zip.002
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
