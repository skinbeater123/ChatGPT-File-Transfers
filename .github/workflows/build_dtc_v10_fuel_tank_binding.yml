name: DTC v10 fuel tank rear binding
on:
  push:
    paths:
      - '.github/workflows/build_dtc_v10_fuel_tank_binding.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact v09 authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh run download 33519947815 --repo skinbeater123/ChatGPT-File-Transfers -n dtc-sprint-a-v09-editable-hood-split -D base
          echo 'b746681f99acce179ffdf60faadf2ee5337d0b5936745f91a0e265e5071765fa  base/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.blend' | sha256sum -c -
      - name: Compile builder
        run: python -m py_compile .github/scripts/build_dtc_v10_fuel_tank_binding.py
      - name: Install Blender 5.2.1
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Build v10
        run: |
          mkdir -p out
          ./blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python .github/scripts/build_dtc_v10_fuel_tank_binding.py -- \
            --blend base/DTC_SPRINT_A_v09_EDITABLE_HOOD_SPLIT.blend \
            --out-blend out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING.blend \
            --report out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING_report.json
      - name: Fresh reload validation
        run: |
          cat >/tmp/validate_v10.py <<'PY'
          import bpy,json,sys
          from pathlib import Path
          blend=Path(sys.argv[sys.argv.index('--')+1]);report=Path(sys.argv[sys.argv.index('--')+2])
          bpy.ops.wm.open_mainfile(filepath=str(blend));r=json.loads(report.read_text());s=bpy.context.scene
          assert s['dtc.asset_version']=='DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING'
          assert bool(s['dtc.fuel_tank_rear_bound']) is True
          t=bpy.data.objects['DTC_FuelTank_RearShell'];b=bpy.data.objects['DTC_RearBumper'];h=bpy.data.objects['DTC_Hood'];loc=bpy.data.objects['mount_fuel_tank_rear']
          assert len(t.data.polygons)==418 and len(b.data.polygons)==455 and len(h.data.polygons)==438
          assert t['dtc.semantic_id']=='FUEL_TANK_REAR' and b['dtc.semantic_id']=='BUMPER_REAR'
          assert len([o for o in bpy.data.collections['DTC_SPRINT_A_BASELINE_V09'].all_objects if o.type=='MESH'])==17
          assert r['geometry_changed'] is False and r['wheel_pivots_preserved'] is True
          print('DTC_SPRINT_A_V10_FRESH_RELOAD_PASS')
          PY
          ./blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python /tmp/validate_v10.py -- out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING.blend out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING_report.json
      - name: Hash and retain report
        run: |
          sha256sum out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING.blend | tee out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING.sha256
          cp out/DTC_SPRINT_A_v10_FUEL_TANK_REAR_BINDING_report.json reports/dtc_v10_fuel_tank_rear_binding_20260902.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add reports/dtc_v10_fuel_tank_rear_binding_20260902.json
          if ! git diff --cached --quiet; then git commit -m 'Record DTC v10 fuel tank rear binding report'; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dtc-sprint-a-v10-fuel-tank-rear-binding
          path: out/
          retention-days: 1
