name: WoO24 ref_width global object consumer trace 20260920
on:
  push:
    paths:
      - '.github/workflows/woo24_ref_width_global_object_consumer_trace_20260920.yml'
      - '.github/scripts/woo24_ref_width_global_object_consumer_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pefile capstone
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf phys_unpack out8
          mkdir -p phys_unpack out8
          unzip -q phys.zip -d phys_unpack
          python .github/scripts/woo24_ref_width_global_object_consumer_trace.py phys_unpack/physimpl.dll out8 | tee out8/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woo24-ref-width-global-object-consumer-trace
          path: out8/
          retention-days: 3
